aid: bounce
name: Bounce
description: >-
  Bounce operates the world's largest luggage storage network, connecting
  travelers with more than 32,000 vetted partner locations across 4,000+ cities
  worldwide where they can securely drop off bags, luggage, and packages by the
  hour or day and explore hands-free. Founded by Cody Candee in 2018, the
  company runs a two-sided marketplace: travelers book storage in advance or on
  the spot through the Bounce web and mobile apps, while local shops, hotels,
  and businesses earn revenue as storage partners. Bounce also offers
  luggage-delivery between hotels, airports, and city locations, a hotel
  solutions program, and an affiliate program. It is backed by Andreessen
  Horowitz, General Catalyst, and Sapphire. This profile currently tracks the
  company's public web surface; Bounce publishes an llms.txt but no public
  developer API.
